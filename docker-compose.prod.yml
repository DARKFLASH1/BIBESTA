# Docker Compose PRODUCTION — BIBESTA
#
# Utilisation (sur le serveur de production) :
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Ce fichier ne contient AUCUN build ni secret : tout est paramétré via `.env.prod`,
# généré par le workflow `deploy-prod.yml` à partir des secrets GitHub.
# Jamais commité, jamais versionné.

services:
  # Base de données MySQL (réseau Docker interne uniquement — pas de port hôte)
  mysql:
    image: mysql:8.4.11
    container_name: bibesta_prod_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requis (voir .env.prod)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE requis (voir .env.prod)}
      MYSQL_USER: ${MYSQL_USERNAME:?MYSQL_USERNAME requis (voir .env.prod)}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD requis (voir .env.prod)}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend-db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - bibesta_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot — image publiée sur GHCR par build-push.yml
  backend:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE requis (ex: ghcr.io/org/bibesta/backend:<sha ou semver>)}"
    container_name: bibesta_prod_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-prod}
      DB_USERNAME: ${MYSQL_USERNAME:?MYSQL_USERNAME requis (voir .env.prod)}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD requis (voir .env.prod)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis (voir .env.prod)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS requis (voir .env.prod)}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true
      DDL_AUTO: ${DDL_AUTO:-update}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - bibesta_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Frontend Angular via Nginx — image publiée sur GHCR par build-push.yml
  frontend:
    image: "${FRONTEND_IMAGE:?FRONTEND_IMAGE requis (ex: ghcr.io/org/bibesta/frontend:<sha ou semver>)}"
    container_name: bibesta_prod_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
    networks:
      - bibesta_network

networks:
  bibesta_network:
    driver: bridge

volumes:
  mysql_data:
