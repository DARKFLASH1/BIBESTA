name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & tests (H2, profil test)
        working-directory: Backend
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production
        working-directory: frontend
        run: npm run build -- --configuration production

  trivy:
    name: Scan vulnérabilités (Trivy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # mirror.gcr.io (défaut Trivy) est inaccessible de façon intermittente
      # depuis les runners GitHub → fallback ghcr.io puis docker.io
      TRIVY_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-db:2,docker.io/aquasec/trivy-db:2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan backend (sources + dépendances)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: 'fs'
          scan-ref: 'Backend/'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'
        # Le scan ne doit pas bloquer le CI (base Trivy indisponible de temps en temps)
        continue-on-error: true

      - name: Scan frontend (sources + dépendances)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: 'fs'
          scan-ref: 'frontend/'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload SARIF backend (Security tab + artefact)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-backend.sarif'
        continue-on-error: true

      - name: Upload SARIF frontend (Security tab + artefact)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-frontend.sarif'
        continue-on-error: true

      # Fallback : les rapports SARIF sont uploadés comme artefacts du run.
      # (Si la permission security-events n'est pas accessible, les fichiers restent consultables ici.)
      - name: Save SARIF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: |
            trivy-backend.sarif
            trivy-frontend.sarif
          if-no-files-found: warn