services:
  # Base de données MySQL
  mysql:
    image: mysql:8.4.11
    container_name: bibesta_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requis (voir .env)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE requis (voir .env)}
      MYSQL_USER: ${MYSQL_USERNAME:?MYSQL_USERNAME requis (voir .env)}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD requis (voir .env)}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Backend/src/main/resources/db:/docker-entrypoint-initdb.d
    networks:
      - bibesta_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: bibesta_backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-prod}
      DB_USERNAME: ${MYSQL_USERNAME:?MYSQL_USERNAME requis (voir .env)}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD requis (voir .env)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis (voir .env)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&zeroDateTimeBehavior=convertToNull
    ports:
      - "8080:8080"
    networks:
      - bibesta_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Frontend Angular
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bibesta_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
    networks:
      - bibesta_network

networks:
  bibesta_network:
    driver: bridge

volumes:
  mysql_data: