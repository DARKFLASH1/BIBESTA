<div class="login-page">

  <!-- Panneau gauche — décoratif -->
  <div class="login-left">
    <div class="left-content">
      <div class="logo-area">
        <svg lucideLibrary size="48" class="logo-icon"></svg>
        <h1>BIBESTA</h1>
      </div>
      <p class="tagline">Votre bibliothèque numérique, simple et élégante.</p>

      <div class="features">
        <div class="feature-item">
          <span class="feature-dot"></span>
          Gestion des emprunts en temps réel
        </div>
        <div class="feature-item">
          <span class="feature-dot"></span>
          Catalogue complet et recherche avancée
        </div>
        <div class="feature-item">
          <span class="feature-dot"></span>
          Notifications automatiques
        </div>
      </div>
    </div>
  </div>

  <!-- Panneau droit — formulaire -->
  <div class="login-right">
    <div class="login-card">

      <div class="card-header">
        <h2>Connexion</h2>
        <p>Entrez vos identifiants pour accéder à la bibliothèque</p>
      </div>

      <!-- Message d'erreur -->
      <div class="erreur-banner" *ngIf="erreur()">
        ⚠️ {{ erreur() }}
      </div>

      <div class="form">
        <!-- Identifiant -->
        <div class="form-group">
          <label for="identifiant">Identifiant</label>
          <input
            id="identifiant"
            class="form-control"
            type="text"
            placeholder="Votre identifiant"
            [(ngModel)]="credentials.identifiant"
            (keydown.enter)="onLogin()"
            autocomplete="username" />
        </div>

        <!-- Mot de passe -->
        <div class="form-group">
          <label for="motDePasse">Mot de passe</label>
          <div class="password-wrapper">
            <input
              id="motDePasse"
              class="form-control"
              [type]="motDePasseVisible ? 'text' : 'password'"
              placeholder="Votre mot de passe"
              [(ngModel)]="credentials.motDePasse"
              (keydown.enter)="onLogin()"
              autocomplete="current-password" />
            <button
              class="toggle-password"
              type="button"
              (click)="motDePasseVisible = !motDePasseVisible"
              [title]="motDePasseVisible ? 'Masquer' : 'Afficher'">
              <svg [attr.data-lucide]="motDePasseVisible ? 'eye-off' : 'eye'" 
                  lucideEye 
                  size="18">
              </svg>
            </button>
          </div>
        </div>

        <!-- Bouton connexion -->
        <button
          class="btn-login"
          (click)="onLogin()"
          [disabled]="chargement()">
          <span *ngIf="!chargement()">Se connecter</span>
          <span *ngIf="chargement()" class="loading-dots">
            Connexion en cours
            <span class="dot">.</span>
            <span class="dot">.</span>
            <span class="dot">.</span>
          </span>
        </button>
      </div>

      <p class="footer-note">
        Système de gestion — BIBESTA © 2025
      </p>
    </div>
  </div>

</div>
