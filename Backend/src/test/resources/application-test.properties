# ================================================
# CONFIGURATION POUR LES TESTS
# ================================================
# Cette configuration est utilisée UNIQUEMENT pour les tests unitaires.
# Elle évite de se connecter à une vraie base de données en utilisant H2 (base en mémoire).

# Utiliser H2 au lieu de MySQL pour les tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate pour H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Désactiver la console H2 pour les tests
spring.h2.console.enabled=false

# Nom de l'application
spring.application.name=bibliotheque-test

# Clé JWT pour les tests (valeur factice)
app.jwt.secret=test_secret_key_for_jwt_token_generation_and_verification_only

# Désactiver le chargement automatique des scripts SQL
spring.sql.init.mode=never
