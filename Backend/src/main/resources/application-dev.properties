# ================================================
# PROFIL DÉVELOPPEMENT LOCAL
# ================================================
# Utiliser UNIQUEMENT en local : mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Ces identifiants ne sont PAS destinés à la production (jamais commiter de vrais secrets).

spring.datasource.username=${DB_USERNAME:***REMOVED***}
spring.datasource.password=${DB_PASSWORD:***REMOVED***}

app.jwt.secret=${JWT_SECRET:***REMOVED***}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true