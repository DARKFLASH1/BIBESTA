# ================================================
# PROFIL DÉVELOPPEMENT LOCAL
# ================================================
# Utiliser UNIQUEMENT en local : mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Aucun secret en dur ici. Charger ../.env ou exporter DB_USERNAME / DB_PASSWORD / JWT_SECRET.
# Fail-fast : si une variable requise est absente, l'app ne démarre pas.

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}

# Dev : Hibernate peut modifier le schéma (n'engage pas la prod)
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true