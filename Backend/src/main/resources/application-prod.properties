# ================================================
# PROFIL PRODUCTION
# ================================================
# Hérite d'application.properties (config de base).
# Ici : tout ce qui est spécifique à la prod.
# Les secrets restent hors code : variables d'env (.env en local, secrets en CI/prod).

# Schéma contrôlé par défaut : Hibernate valide sans rien modifier.
# Surchargable par env pour l'amorçage (ex: DDL_AUTO=update dans docker-compose
# pour créer le schéma au premier démarrage, tant que les migrations ne sont pas en place).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# Journalisation SQL off
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS : origines autorisées via env (défaut : localhost:4200)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}