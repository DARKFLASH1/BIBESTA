# ================================================
# PROFIL PRODUCTION
# ================================================
# Hérite d'application.properties (config de base).
# Ici : tout ce qui est spécifique à la prod.
# Les secrets restent hors code : variables d'env (.env en local, secrets en CI/prod).

# Schéma contrôlé : Hibernate valide sans rien modifier.
spring.jpa.hibernate.ddl-auto=validate

# Journalisation SQL off
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS : origines autorisées via env (défaut : localhost:4200)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}