# ================================================
# CONFIGURATION DE LA BASE DE DONNÉES
# ================================================

# URL de connexion à MySQL
# "localhost" = sur ta propre machine
# "3306" = port par défaut de MySQL
# "bibliotheque" = nom de ta base de données
# useSSL / allowPublicKeyRetrieval configurables via env (prod = SSL requis)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bibliotheque}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&zeroDateTimeBehavior=convertToNull

# Identifiant / mot de passe MySQL — OBLIGATOIRES via variables d'environnement.
# Le démarrage échoue si DB_USERNAME / DB_PASSWORD ne sont pas définies.
# Pour le dev local : utiliser le profil 'dev' (application-dev.properties).
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Le pilote Java qui parle à MySQL (celui qu'on a ajouté dans pom.xml)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================================
# CONFIGURATION JPA / HIBERNATE
# ================================================

# PROD : schéma contrôlé, Hibernate ne modifie PAS les tables.
# "validate" vérifie la cohérence au démarrage (fail-fast si écart).
# Le mode "update" est réservé au profil 'dev' (application-dev.properties).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# Journalisation SQL désactivée par défaut (prod). Activée en dev uniquement.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Désactive Open Session In View : toute relation lazy doit être chargée
# explicitement (EntityGraph / JOIN FETCH) avant la fin de la transaction.
spring.jpa.open-in-view=false

# Précise qu'on utilise MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ================================================
# CONFIGURATION DU SERVEUR
# ================================================

# Port sur lequel ton API sera accessible
# http://localhost:8080/api/...
server.port=8080

# Préfixe pour tous tes endpoints (ex: /api/books, /api/users)
server.servlet.context-path=/api

# ================================================
# CONFIGURATION DE L'APPLICATION
# ================================================

# Nom de l'application (affiché au démarrage)
spring.application.name=bibliotheque

# ================================================
# SÉCURITÉ
# ================================================

# Clé de signature JWT — OBLIGATOIRE via la variable d'env JWT_SECRET.
# Le démarrage échoue si elle n'est pas définie. (Profil 'dev' pour le local.)
app.jwt.secret=${JWT_SECRET}

# Durée de validité du token JWT en millisecondes (défaut : 60 min).
# P2.5 : pas de "remember me", TTL court.
app.jwt.expiration=${JWT_EXPIRATION:3600000}

# ================================================
# RATE LIMITING (P2.4)
# ================================================

# Protection brute-force sur /api/auth/login :
# nombre max de tentatives autorisées par fenêtre, puis blocage temporaire.
app.rate-limit.max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:5}
app.rate-limit.window-ms=${RATE_LIMIT_WINDOW_MS:60000}
app.rate-limit.block-ms=${RATE_LIMIT_BLOCK_MS:300000}
