# ================================================
# CONFIGURATION DE LA BASE DE DONNÉES
# ================================================

# URL de connexion à MySQL
# "localhost" = sur ta propre machine
# "3306" = port par défaut de MySQL
# "bibliotheque" = nom de ta base de données
spring.datasource.url=jdbc:mysql://localhost:3306/bibliotheque?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull

# Identifiant / mot de passe MySQL — lus depuis des variables d'environnement,
# avec valeur par défaut UNIQUEMENT pour le poste de dev local (après le ':').
# En prod : exporter DB_USERNAME / DB_PASSWORD, ne jamais commiter de vraies valeurs.
spring.datasource.username=${DB_USERNAME:darkflash1}
spring.datasource.password=${DB_PASSWORD:yellowflash}

# Le pilote Java qui parle à MySQL (celui qu'on a ajouté dans pom.xml)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================================
# CONFIGURATION JPA / HIBERNATE
# ================================================

# "update" = Hibernate crée/modifie les tables automatiquement
# selon tes classes Java (on verra ça avec les entités)
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL dans le terminal (utile pour déboguer)
spring.jpa.show-sql=true

# Rend les requêtes SQL lisibles (avec indentation)
spring.jpa.properties.hibernate.format_sql=true

# Précise qu'on utilise MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ================================================
# CONFIGURATION DU SERVEUR
# ================================================

# Port sur lequel ton API sera accessible
# http://localhost:8080/api/...
server.port=8080

# Préfixe pour tous tes endpoints (ex: /api/books, /api/users)
server.servlet.context-path=/api

# ================================================
# CONFIGURATION DE L'APPLICATION
# ================================================

# Nom de l'application (affiché au démarrage)
spring.application.name=bibliotheque

# ================================================
# SÉCURITÉ
# ================================================

# Clé de signature JWT — DOIT être fournie via la variable d'env JWT_SECRET
# en production. La valeur par défaut ci-dessous n'est utilisable qu'en local
# et ne doit jamais servir en prod (rotation immédiate si elle a fuité un jour).
app.jwt.secret=${JWT_SECRET:changez_moi_en_dev_uniquement_valeur_temporaire}
